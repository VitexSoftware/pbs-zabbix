<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA347"/>
      <stop offset="100%" stop-color="#E57000"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4444"/>
      <stop offset="100%" stop-color="#C81414"/>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="200" cy="200" r="180"/>
    </clipPath>
  </defs>

  <!-- outer ring -->
  <circle cx="200" cy="200" r="188" fill="none" stroke="#2B2B2B" stroke-width="2" opacity="0.15"/>

  <g clip-path="url(#circleClip)">
    <!-- left half: orange (Proxmox side) -->
    <rect x="20" y="20" width="180" height="360" fill="url(#orangeGrad)"/>
    <!-- right half: red (Zabbix side) -->
    <rect x="200" y="20" width="180" height="360" fill="url(#redGrad)"/>

    <!-- subtle diagonal seam -->
    <polygon points="200,20 210,20 190,380 200,380" fill="#00000018"/>

    <!-- stacked server nodes (virtualization) on the left -->
    <g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
      <rect x="70" y="150" width="70" height="34" rx="6"/>
      <rect x="70" y="190" width="70" height="34" rx="6"/>
      <rect x="70" y="230" width="70" height="34" rx="6"/>
      <circle cx="86" cy="167" r="3.5" fill="#FFFFFF" stroke="none"/>
      <circle cx="86" cy="207" r="3.5" fill="#FFFFFF" stroke="none"/>
      <circle cx="86" cy="247" r="3.5" fill="#FFFFFF" stroke="none"/>
    </g>

    <!-- pulse / monitoring line crossing the seam, tying both halves together -->
    <polyline points="60,200 150,200 175,140 205,260 230,200 340,200"
              fill="none" stroke="#FFFFFF" stroke-width="9"
              stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="340" cy="200" r="8" fill="#FFFFFF"/>
  </g>

  <!-- inner ring highlight -->
  <circle cx="200" cy="200" r="180" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.25"/>
</svg>
